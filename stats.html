<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Quotal — Funnel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/quotal.css">

  <style>
    :root { --warn: #A33B30; }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

    h1 { font-size: 2rem; }
    .sub { font-size: .9375rem; color: var(--muted); margin-top: .5rem; }

    .controls { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.85rem 0 2.25rem; align-items: center; }
    .controls input, .controls select { width: auto; flex: 0 1 auto; font-size: .9375rem; padding: .6rem .85rem; }
    .controls button { flex: none; padding: .68rem 1.4rem; }

    .msg { font-size: .9375rem; color: var(--muted); padding: 1rem 0; }
    .msg.err { color: var(--warn); }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: .9rem; margin-bottom: 2.5rem; }
    .card { padding: 1.15rem 1.25rem; }

    .card-k {
      font-family: var(--f-mono); font-size: .6875rem; font-weight: 500;
      letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    }
    /* the numbers are the point — display face, tabular, filament */
    .card-v {
      font-family: var(--f-display); font-weight: 800; letter-spacing: -.045em;
      font-variant-numeric: tabular-nums; font-size: 1.9rem;
      color: var(--bone); margin-top: .4rem; line-height: 1;
    }
    .card-n { font-size: .8125rem; color: var(--muted); margin-top: .4rem; }

    h2 {
      font-family: var(--f-mono); font-size: .75rem; font-weight: 500;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--muted); margin: 2.5rem 0 1rem;
    }

    .fun { display: flex; flex-direction: column; gap: .55rem; }
    .frow { display: grid; grid-template-columns: 180px 1fr 140px; gap: 1rem; align-items: center; }
    .fname { font-size: .9375rem; color: var(--bone); }
    .fname span { font-family: var(--f-mono); color: var(--muted); font-size: .75rem; letter-spacing: .14em; margin-right: .55rem; }
    .fbar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); height: 30px; overflow: hidden; }
    .fbar i { display: block; height: 100%; background: var(--filament); opacity: .85; }
    .fmeta { font-family: var(--f-mono); font-size: .8125rem; font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
    .fdrop { color: var(--warn); }

    table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
    th {
      text-align: left; font-family: var(--f-mono); font-size: .6875rem; font-weight: 500;
      letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 0 0 .65rem;
    }
    td { padding: .65rem 0; border-top: 1px solid var(--line); color: var(--bone); }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; }
    .tbl-scroll { overflow-x: auto; }

    @media (max-width: 760px) {
      .grid2 { grid-template-columns: 1fr; gap: 0; }
      .frow { grid-template-columns: 110px 1fr; }
      .fmeta { grid-column: 1 / -1; text-align: left; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Funnel</h1>
  <p class="sub">Where people get to in the quote journey, and where they leave.</p>

  <div class="controls">
    <input id="site" placeholder="Site (blank = all)" aria-label="Site" />
    <select id="days" aria-label="Period">
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="365">Last year</option>
    </select>
    <input id="token" type="password" placeholder="Access token" aria-label="Access token" />
    <button class="btn btn-solid" id="go">Load</button>
  </div>

  <div class="msg" id="msg">Enter your token and press Load.</div>
  <div id="out" hidden>
    <div class="cards" id="cards"></div>

    <h2>Funnel</h2>
    <div class="fun" id="funnel"></div>

    <div class="grid2">
      <div>
        <h2>Traffic source</h2>
        <div class="tbl-scroll"><table id="tSource"></table></div>
      </div>
      <div>
        <h2>Device</h2>
        <div class="tbl-scroll"><table id="tDevice"></table></div>
      </div>
      <div>
        <h2>Service quoted</h2>
        <div class="tbl-scroll"><table id="tService"></table></div>
      </div>
      <div>
        <h2>Conversion by price</h2>
        <div class="tbl-scroll"><table id="tBands"></table></div>
      </div>
    </div>
  </div>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };

  /* token is remembered locally so you're not retyping it every visit */
  try { $('token').value = localStorage.getItem('oq_token') || ''; } catch (e) {}
  try { $('site').value  = localStorage.getItem('oq_site')  || ''; } catch (e) {}

  $('go').addEventListener('click', load);
  $('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });

  function load() {
    var token = $('token').value.trim();
    var site  = $('site').value.trim();
    var days  = $('days').value;
    if (!token) return say('Token required.', true);

    try { localStorage.setItem('oq_token', token); localStorage.setItem('oq_site', site); } catch (e) {}

    say('Loading…');
    $('out').hidden = true;

    var url = '/.netlify/functions/stats?days=' + days +
              '&token=' + encodeURIComponent(token) +
              (site ? '&site=' + encodeURIComponent(site) : '');

    fetch(url)
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) return say(res.j.error || 'Request failed.', true);
        render(res.j);
      })
      .catch(function () { say('Could not reach the stats function.', true); });
  }

  function say(t, isErr) {
    var m = $('msg');
    m.textContent = t;
    m.className = 'msg' + (isErr ? ' err' : '');
    m.hidden = false;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
    });
  }

  function render(d) {
    var t = d.totals;
    if (!t.sessions) return say('No data yet for that period.');

    $('msg').hidden = true;
    $('out').hidden = false;

    $('cards').innerHTML = [
      card('Sessions', t.sessions, 'people who started'),
      card('Saw a price', t.reachedPrice, t.quoteRate + '% of sessions'),
      card('Leads', t.leads, t.leadRate + '% of sessions'),
      card('Price → lead', t.closeRate + '%', 'of those who saw a price'),
      card('Median quote', t.medianPrice != null ? '$' + t.medianPrice : '—', 'across priced sessions'),
      card('Median time', t.medianSeconds != null ? t.medianSeconds + 's' : '—', 'on the page')
    ].join('');

    var max = Math.max.apply(null, d.funnel.map(function (f) { return f.reached; }).concat([1]));
    $('funnel').innerHTML = d.funnel.map(function (f) {
      return '<div class="frow">' +
        '<div class="fname"><span>' + String(f.step).padStart(2, '0') + '</span>' + esc(f.name) + '</div>' +
        '<div class="fbar"><i style="width:' + Math.max(1, (f.reached / max) * 100) + '%"></i></div>' +
        '<div class="fmeta">' + f.reached + ' &middot; ' + f.pct + '%' +
          (f.dropFromPrev > 0 ? ' <span class="fdrop">&minus;' + f.dropFromPrev + '%</span>' : '') +
        '</div></div>';
    }).join('');

    table('tSource',  d.bySource,  'Source');
    table('tDevice',  d.byDevice,  'Device');
    table('tService', d.byService, 'Service');
    table('tBands',   d.priceBands, 'Price band');
  }

  function card(k, v, n) {
    return '<div class="card"><div class="card-k">' + esc(k) + '</div>' +
           '<div class="card-v">' + esc(v) + '</div>' +
           '<div class="card-n">' + esc(n) + '</div></div>';
  }

  function table(id, rows, label) {
    var el = $(id);
    if (!rows || !rows.length) { el.innerHTML = '<tr><td>No data</td></tr>'; return; }
    el.innerHTML =
      '<tr><th>' + esc(label) + '</th><th class="n">Sessions</th><th class="n">Leads</th><th class="n">Rate</th></tr>' +
      rows.slice(0, 12).map(function (r) {
        return '<tr><td>' + esc(r.key) + '</td><td class="n">' + r.sessions +
               '</td><td class="n">' + r.leads + '</td><td class="n">' + r.leadRate + '%</td></tr>';
      }).join('');
  }
</script>
</body>
</html>
