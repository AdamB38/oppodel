<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oppodel</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080809;
      --surface: #111113;
      --border:  #1e1e22;
      --accent:  #7c6fff;
      --text:    #f0f0f5;
      --muted:   #52525f;
      --subtle:  #2a2a32;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    /* faint radial glow behind the form */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(124,111,255,.07) 0%, transparent 70%);
      pointer-events: none;
    }

    header {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 4rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .logo-text {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .headline {
      font-size: clamp(1.75rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      max-width: 560px;
      margin-bottom: .6rem;
      letter-spacing: -.02em;
    }

    .headline em {
      font-style: normal;
      color: var(--accent);
    }

    .sub {
      font-size: .82rem;
      font-weight: 400;
      color: var(--muted);
      text-align: center;
      letter-spacing: .04em;
      margin-bottom: 3rem;
    }

    form {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem;
    }

    input, textarea, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: .82rem;
      font-weight: 400;
      padding: .85rem 1rem;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
      resize: none;
      appearance: none;
    }

    input::placeholder, textarea::placeholder { color: var(--muted); }
    select { color: var(--muted); cursor: pointer; }
    select.filled { color: var(--text); }

    input:focus, textarea:focus, select:focus {
      border-color: rgba(124,111,255,.5);
      box-shadow: 0 0 0 3px rgba(124,111,255,.08);
    }

    textarea { height: 100px; }

    button {
      width: 100%;
      padding: .9rem;
      margin-top: .25rem;
      background: var(--accent);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
    }

    button:hover  { opacity: .88; }
    button:active { transform: scale(.985); }

    footer {
      margin-top: 2.5rem;
      font-size: .65rem;
      font-weight: 500;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <span class="dot"></span>
    <span class="logo-text">Oppodel</span>
  </header>

  <h1 class="headline">Want Some <em>Nerds</em> To Build You Something?</h1>
  <p class="sub">Tell us what you need &mdash; we'll handle the rest.</p>

  <form>
    <div class="row">
      <input type="text" placeholder="First name" />
      <input type="text" placeholder="Last name" />
    </div>

    <input type="email" placeholder="Email address" />

    <select onchange="this.classList.toggle('filled', this.value !== '')">
      <option value="" disabled selected>What do you need?</option>
      <option>Website or Web App</option>
      <option>Automation / Scripts</option>
      <option>Network or IT Setup</option>
      <option>Database / Backend</option>
      <option>Something Else</option>
    </select>

    <textarea placeholder="Describe your idea..."></textarea>

    <button type="submit">Send it over</button>
  </form>

  <footer>oppodel.com</footer>

</body>
</html>
