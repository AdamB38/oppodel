# Static site — no build step. The functions directory is bundled by Netlify,
# which installs the dependencies in package.json automatically.
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Domain move: quotal.org is the brand's home. Every oppodel.com URL
# 301s to its exact twin on quotal.org — old links, printed QRs and any
# drafted ads all keep working. These are hard 301s (the move is
# permanent), unlike the reversible page-level 302s further down.
# mkmexteriors.oppodel.com is a SEPARATE Netlify site and is untouched.
[[redirects]]
  from = "https://oppodel.com/*"
  to = "https://quotal.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.oppodel.com/*"
  to = "https://quotal.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://oppodel.com/*"
  to = "https://quotal.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.oppodel.com/*"
  to = "https://quotal.org/:splat"
  status = 301
  force = true

# /beta and /founders are both retired; /pricing is the offer page. Sent
# straight to /pricing rather than chaining /beta -> /founders -> /pricing,
# which would cost every visitor an extra round trip.
#
# 302 rather than 301 on purpose: these are reversible, and a 301 gets
# cached hard by the browser. Switch to 301 once you're sure.
#
# Live ads may still point at either path — both keep working.
[[redirects]]
  from = "/beta"
  to = "/pricing"
  status = 302
  force = true

[[redirects]]
  from = "/beta/*"
  to = "/pricing"
  status = 302
  force = true

[[redirects]]
  from = "/founders"
  to = "/pricing"
  status = 302
  force = true

[[redirects]]
  from = "/founders/*"
  to = "/pricing"
  status = 302
  force = true
